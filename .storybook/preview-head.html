<!--
    Fontes do app no Storybook web.

    No app quem carrega o Inter é o `useFonts` do expo-font, que não existe no
    navegador: sem estas declarações o react-native-web cai na fonte do sistema
    e a story mente sobre peso, altura de linha e largura do texto — justamente
    o que se está tentando avaliar.

    O nome de cada família é o mesmo de `constants/fonts` (`Inter-Regular`,
    `Inter-SemiBold`, ...), porque é esse nome que chega no `fontFamily` dos
    componentes. Os arquivos vêm de `assets/fonts/inter`, servidos em `/fonts`
    pelo `staticDirs` do main.ts. Aqui usa-se o .woff2 (o app usa o .otf):
    mesma fonte, formato próprio para web.
-->
